name: Deploy to k3s

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: production-k3s
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Build, attest, and deploy
    runs-on: [self-hosted, Linux, ARM64]
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish arm64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:0.0.1
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=0.0.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Apply namespace
        run: kubectl apply --filename k8s/namespace.yaml

      - name: Reconcile Discord token secret
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          test -n "$DISCORD_TOKEN"
          printf 'DISCORD_TOKEN=%s\n' "$DISCORD_TOKEN" \
            | kubectl --namespace wiz-hatch create secret generic wiz-hatch \
                --from-env-file=/dev/stdin --dry-run=client --output=yaml \
            | kubectl apply --filename=-

      - name: Deploy immutable revision
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          kubectl --namespace wiz-hatch set image --local \
            --filename k8s/deployment.yaml wiz-hatch="$IMAGE" --output=yaml \
            | kubectl apply --filename=-
          kubectl --namespace wiz-hatch annotate deployment/wiz-hatch \
            app.kubernetes.io/revision="${GITHUB_SHA}" --overwrite
          kubectl --namespace wiz-hatch rollout status deployment/wiz-hatch --timeout=180s
